name: Binance Square Hourly Post

on:
  workflow_dispatch: {}   # triggered externally by cron-job.org every hour

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Binance's official square-post skill
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/binance/binance-skills-hub.git skill-src
          cd skill-src
          git sparse-checkout set skills/binance/square-post
        continue-on-error: true   # if this fails, the bot still posts text-only

      - name: Run bot
        env:
          SQUARE_OPENAPI_KEY: ${{ secrets.SQUARE_OPENAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python square_bot.py
