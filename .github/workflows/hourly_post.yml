name: Binance Square Hourly Post

on:
  schedule:
    # Runs at minute 1 of every hour (UTC = Algeria time, since Algeria is UTC+1 with no fractional offset)
    - cron: "1 * * * *"  # Runs at :01 every hour, Algeria time included
  workflow_dispatch: {}  # allows manual runs from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SQUARE_OPENAPI_KEY: ${{ secrets.SQUARE_OPENAPI_KEY }}
        run: python square_bot.py
