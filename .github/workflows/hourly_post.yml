name: Binance Square Hourly Post

on:
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch pinned official square-post skill
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/binance/binance-skills-hub.git skill-src
          cd skill-src
          git sparse-checkout set skills/binance/square-post
          git checkout ${{ vars.SKILL_PINNED_COMMIT || 'main' }}
        continue-on-error: true

      - name: Run bot
        env:
          SQUARE_OPENAPI_KEY: ${{ secrets.SQUARE_OPENAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python square_bot.py

      - name: Commit updated state
        run: |
          git config user.name "square-bot"
          git config user.email "square-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update bot state [skip ci]"
          git push
